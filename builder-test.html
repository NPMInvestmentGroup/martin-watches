<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MARTIN — Watch Builder (Test)</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9A84C; --gold-dim: #8a7233; --cream: #f1ece0;
    --black: #0a0a0a; --dark-2: #141414; --dark-3: #1d1d1d; --dark-4: #2c2c2c; --mid: #9a9588;
    --serif: 'Cormorant Garamond', Georgia, serif; --sans: 'Josefin Sans', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--black); color: var(--cream); font-family: var(--sans); font-weight: 300; min-height: 100vh; }

  .test-banner {
    background: #3a2a05; color: var(--gold); text-align: center; font-size: 0.62rem;
    letter-spacing: 0.25em; text-transform: uppercase; padding: 0.55rem 1rem;
  }
  header { text-align: center; padding: 2.2rem 1rem 0.5rem; }
  .logo { font-family: var(--serif); font-size: 2.1rem; letter-spacing: 0.4em; color: var(--gold); font-weight: 400; }
  .sub { font-size: 0.6rem; letter-spacing: 0.35em; text-transform: uppercase; color: var(--mid); margin-top: 0.4rem; }

  .layout { display: grid; grid-template-columns: minmax(320px, 1fr) minmax(340px, 560px); gap: 3rem; max-width: 1280px; margin: 0 auto; padding: 1.5rem 2rem 4rem; align-items: start; }

  /* ---------- preview ---------- */
  .stage-wrap { position: sticky; top: 1rem; text-align: center; }
  .stage {
    position: relative; width: 100%; max-width: 640px; aspect-ratio: 1 / 1; margin: 0 auto;
    background: radial-gradient(circle at 50% 45%, #1b1b1b 0%, #0b0b0b 70%);
    border: 1px solid var(--dark-3); overflow: hidden;
  }
  .stage img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transition: opacity 0.25s ease; }
  .stage img.hidden { opacity: 0; }
  .z-dials { z-index: 1; } .z-bracelets { z-index: 2; } .z-cases { z-index: 3; } .z-rings { z-index: 4; } .z-frames { z-index: 4; } .z-bezels { z-index: 5; } .z-gmthands { z-index: 6; } .z-hands { z-index: 7; }
  .stage-loading { position: absolute; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; font-size: 0.65rem; letter-spacing: 0.25em; text-transform: uppercase; color: var(--mid); background: var(--black); transition: opacity .4s; }
  .stage-loading.done { opacity: 0; pointer-events: none; }

  .build-name { font-family: var(--serif); font-size: 1.35rem; margin-top: 1.3rem; color: var(--cream); letter-spacing: 0.05em; }
  .build-detail { font-size: 0.68rem; letter-spacing: 0.12em; color: var(--mid); margin-top: 0.5rem; line-height: 1.9; }
  .price { font-family: var(--serif); font-size: 2.2rem; color: var(--gold); margin-top: 0.8rem; }
  .actions { display: flex; gap: 0.7rem; justify-content: center; margin-top: 1.1rem; flex-wrap: wrap; }
  .btn { background: none; border: 1px solid var(--dark-4); color: var(--cream); font-family: var(--sans); font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase; padding: 0.8rem 1.3rem; cursor: pointer; transition: all .2s; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }

  /* ---------- options ---------- */
  .group { margin-bottom: 2rem; }
  .group-title { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 1px solid var(--dark-3); padding-bottom: 0.6rem; margin-bottom: 0.9rem; }
  .group-title h2 { font-family: var(--serif); font-weight: 400; font-size: 1.15rem; letter-spacing: 0.08em; }
  .group-title span { font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
  .opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 0.6rem; }
  .opt { background: var(--dark-2); border: 1px solid var(--dark-3); color: var(--cream); cursor: pointer; padding: 0.5rem 0.4rem 0.6rem; font-family: var(--sans); text-align: center; transition: border-color .2s, background .2s; }
  .opt:hover { border-color: var(--gold-dim); }
  .opt[aria-pressed="true"] { border-color: var(--gold); background: #1a160a; }
  .opt img { width: 100%; aspect-ratio: 1 / 1; object-fit: contain; display: block; background: radial-gradient(circle, #232323, #0e0e0e); margin-bottom: 0.45rem; }
  .opt .lbl { font-size: 0.58rem; letter-spacing: 0.1em; line-height: 1.4; color: var(--cream); }


  /* ---------- family picker ---------- */
  .families { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; max-width: 1280px; margin: 1.4rem auto 0; padding: 0 1rem; }
  .fam { background: none; border: 1px solid var(--dark-4); color: var(--cream); cursor: pointer; padding: 0.75rem 1.4rem; font-family: var(--sans); text-align: center; transition: all .2s; min-width: 120px; }
  .fam:hover { border-color: var(--gold-dim); }
  .fam[aria-pressed="true"] { border-color: var(--gold); background: #1a160a; }
  .fam .fn { font-family: var(--serif); font-size: 1.05rem; letter-spacing: 0.08em; display: block; }
  .fam .fs { font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-top: 0.25rem; display: block; }
  .size-line { font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--gold); margin-top: 0.7rem; }

  .error { max-width: 620px; margin: 3rem auto; text-align: center; color: #e05555; font-size: 0.8rem; line-height: 1.8; }

  @media (max-width: 880px) {
    .layout { grid-template-columns: 1fr; gap: 1.5rem; padding: 1rem 1rem 3rem; }
    .stage-wrap { position: static; }
    .opts { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  }
</style>
</head>
<body>
<div class="test-banner">Test build &mdash; not linked from the site</div>
<header>
  <div class="logo">MARTIN</div>
  <div class="sub">Build Your Own</div>
</header>
<div class="families" id="families"></div>

<div class="layout" id="layout" style="display:none">
  <section class="stage-wrap">
    <div class="stage" id="stage">
      <div class="stage-loading" id="stageLoading">Loading</div>
    </div>
    <div class="build-name" id="buildName">MARTIN</div>
    <div class="size-line" id="sizeLine"></div>
    <div class="build-detail" id="buildDetail"></div>
    <div class="price" id="price">$600</div>
    <div class="actions">
      <button class="btn" id="btnRandom">Surprise me</button>
      <button class="btn" id="btnRandomAny">Surprise me &mdash; any family</button>
      <button class="btn" id="btnReset">Reset</button>
      <button class="btn" id="btnCopy">Copy build</button>
    </div>
  </section>
  <section id="groups"></section>
</div>
<div class="error" id="error" style="display:none"></div>

<script>
const LABELS = { dials: 'Dial', bezels: 'Bezel', cases: 'Case', bracelets: 'Bracelet / Strap', gmthands: 'GMT Hand', hands: 'Hands' };
let FAMS = {};                 // family id -> { name, size_mm, price, layers, parts }
let famId = null;
let switchToken = 0;            // a newer click always wins over an older, still-loading one
const chosen = {};             // category -> item
const layerEls = {};           // category -> <img>
const $ = id => document.getElementById(id);
const sizeText = f => [f.size_mm ? f.size_mm + ' mm case' : '', f.dialSize ? f.dialSize + ' mm dial' : ''].filter(Boolean).join('  ·  ');

async function init() {
  try {
    const res = await fetch('builds.json?v=' + Date.now(), { cache: 'no-cache' });
    if (!res.ok) throw new Error('builds.json not found');
    FAMS = (await res.json()).families || {};
    if (!Object.keys(FAMS).length) throw new Error('no families are ready yet');
  } catch (e) {
    $('error').style.display = 'block';
    $('error').textContent = 'Could not load the parts list (' + e.message + '). It is generated on every deploy, so this page only works on the live site, not when opened as a plain file.';
    return;
  }
  $('layout').style.display = 'grid';
  buildFamilyTabs();
  const want = location.hash.replace('#', '');
  await switchFamily(FAMS[want] ? want : Object.keys(FAMS)[0]);
}

function buildFamilyTabs() {
  const box = $('families'); box.innerHTML = '';
  for (const [id, f] of Object.entries(FAMS)) {
    const b = document.createElement('button'); b.className = 'fam'; b.type = 'button'; b.dataset.id = id; b.setAttribute('aria-pressed', 'false');
    b.innerHTML = '<span class="fn"></span><span class="fs"></span>';
    b.querySelector('.fn').textContent = f.name; b.querySelector('.fs').textContent = f.size_mm ? f.size_mm + ' mm' : '';
    b.onclick = () => switchFamily(id);
    box.appendChild(b);
  }
}

async function switchFamily(id, keep = true) {
  const f = FAMS[id]; if (!f) return;
  const my = ++switchToken;
  const prev = Object.fromEntries(Object.entries(chosen).map(([k, v]) => [k, v.id]));
  famId = id; history.replaceState(null, '', '#' + id);
  document.querySelectorAll('.fam').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === id)));
  // fresh stage + option groups for this family's layers
  for (const k of Object.keys(chosen)) delete chosen[k];
  const stage = $('stage'); stage.querySelectorAll('img').forEach(i => i.remove());
  for (const k of Object.keys(layerEls)) delete layerEls[k];
  for (const cat of f.layers) {
    const img = document.createElement('img'); img.className = 'z-' + cat + ' hidden'; img.alt = ''; img.draggable = false;
    if (cat === 'dials' && f.dialScale && f.dialScale !== 1) img.style.transform = 'scale(' + f.dialScale + ')';     // this case shows the whole printed dial edge
    if ((cat === 'hands' || cat === 'gmthands') && f.handScale && f.handScale !== 1) img.style.transform = 'scale(' + f.handScale + ')';   // smaller dial opening: hands shrink with the dial
    if (cat === 'bracelets' && f.strapOffset) img.style.transform = 'translateX(' + (f.strapOffset / 15) + '%)';           // this case's lugs sit a few px off the centre line
    stage.appendChild(img); layerEls[cat] = img;
  }
  if (f.ring) {                                                  // engraved ring (Saturation Diver); follows the case finish
    const rg = document.createElement('img'); rg.className = 'z-rings hidden'; rg.alt = ''; rg.draggable = false;
    stage.appendChild(rg); layerEls.rings = rg;
    [f.ring.src, ...Object.values(f.ring.byCase || {})].forEach(u => { const i = new Image(); i.src = u; });
  }
  if (f.frame) {                                                 // shared toothed bezel frame; follows the case metal
    const fr = document.createElement('img'); fr.className = 'z-frames hidden'; fr.alt = ''; fr.draggable = false;
    stage.appendChild(fr); layerEls.frames = fr;
    [f.frame.src, f.frame.srcGold, f.frame.srcBlack].filter(Boolean).forEach(u => { const i = new Image(); i.src = u; });
  }
  buildGroups(f);
  await Promise.all(f.layers.map(async cat => {                 // load every layer at once; keep the same pick when the new family offers it
    if (my !== switchToken || chosen[cat]) return;                // (and keep anything the visitor already picked while this was loading)
    const list = f.parts[cat]; const same = keep && list.find(p => p.id === prev[cat]);
    await choose(cat, same || list[0], true);
  }));
  if (my !== switchToken) return;
  updateSummary();
  $('stageLoading').classList.add('done');
  preloadAll(f);
}

function buildGroups(f) {
  const root = $('groups'); root.innerHTML = '';
  for (const cat of f.layers) {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<div class="group-title"><h2>${LABELS[cat]}</h2><span id="sel-${cat}"></span></div><div class="opts" id="opts-${cat}"></div>`;
    root.appendChild(g);
    const box = g.querySelector('.opts');
    for (const it of f.parts[cat]) {
      const b = document.createElement('button'); b.className = 'opt'; b.type = 'button'; b.dataset.id = it.id; b.setAttribute('aria-pressed', 'false');
      b.innerHTML = `<img src="${it.thumb}" alt="" loading="lazy" width="110" height="110"><div class="lbl"></div>`;
      b.querySelector('.lbl').textContent = it.label;
      b.onclick = () => choose(cat, it);
      box.appendChild(b);
    }
  }
}

async function choose(cat, it, quiet) {
  if (!layerEls[cat] || !$('sel-' + cat)) return;                // that category is not part of the current family
  if (!FAMS[famId].parts[cat].includes(it)) return;              // a pick from some other family: ignore
  chosen[cat] = it;
  document.querySelectorAll(`#opts-${cat} .opt`).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.id === it.id)));
  $('sel-' + cat).textContent = it.label;
  const want = layerSrc(cat, it);
  const pre = new Image(); pre.src = want;                       // swap only once decoded: no blank flash
  try { await pre.decode(); } catch (e) {}
  if (chosen[cat] !== it) return;
  const el = layerEls[cat]; if (!el || !el.isConnected) return;
  el.src = want; el.classList.remove('hidden');
  if (!quiet) updateSummary();
  if (cat === 'cases') { setFrame(); setRing(); }
  if (cat === 'cases' && chosen.bezels && layerSrc('bezels', chosen.bezels) !== (layerEls.bezels || {}).getAttribute?.('src')) choose('bezels', chosen.bezels, true);
  if (cat === 'dials' && chosen.hands && layerSrc('hands', chosen.hands) !== (layerEls.hands || {}).getAttribute?.('src')) choose('hands', chosen.hands, true);   // new dial: its own chronograph hands   // gold / two-tone case: swap the bezel to its gold-teeth version
}
// gold / two-tone cases get the bezel with its steel teeth recoloured to gold
function setRing() {
  const f = FAMS[famId], el = layerEls.rings; if (!f || !f.ring || !el) return;
  const want = (chosen.cases && f.ring.byCase && f.ring.byCase[chosen.cases.id]) || f.ring.src;
  if (el.getAttribute('src') !== want) el.src = want;
  el.classList.remove('hidden');
}
function setFrame() {
  const f = FAMS[famId], el = layerEls.frames; if (!f || !f.frame || !el) return;
  const c = chosen.cases || {};
  const want = (c.goldFrame && f.frame.srcGold) ? f.frame.srcGold : (c.blackFrame && f.frame.srcBlack) ? f.frame.srcBlack : f.frame.src;
  if (el.getAttribute('src') !== want) el.src = want;          // both frames are preloaded when the family opens
  el.classList.remove('hidden');
}
function layerSrc(cat, it) {
  if (cat === 'hands' && it.srcByDial && chosen.dials && it.srcByDial[chosen.dials.id]) return it.srcByDial[chosen.dials.id];   // chronograph hands follow the dial's sub-dials
  return (cat === 'bezels' && chosen.cases && chosen.cases.goldFrame && it.srcGold) ? it.srcGold : it.src;
}

function updateSummary() {
  const f = FAMS[famId], c = k => chosen[k] ? chosen[k].label : '';
  $('buildName').textContent = 'MARTIN ' + f.name + ' — ' + c('dials') + ' Dial';
  $('sizeLine').textContent = sizeText(f);
  const lines = [];
  if (chosen.bezels) lines.push(c('bezels') + ' bezel');
  lines.push(c('cases') + ' case', c('bracelets') + ' bracelet');
  if (chosen.gmthands) lines.push(c('gmthands') + ' GMT hand');
  lines.push(c('hands') + ' hands');
  $('buildDetail').innerHTML = lines.join('<br>');
  $('price').textContent = '$' + f.price.toLocaleString();
}

async function reset() { await switchFamily(famId, false); }
async function surprise() {
  const f = FAMS[famId], tok = switchToken;
  await Promise.all(f.layers.map(cat => { const l = f.parts[cat]; return choose(cat, l[Math.floor(Math.random() * l.length)], true); }));
  if (tok === switchToken) updateSummary();
}
async function surpriseAny() {
  const ids = Object.keys(FAMS); await switchFamily(ids[Math.floor(Math.random() * ids.length)], false); await surprise();
}
function summaryText() {
  const f = FAMS[famId], c = k => chosen[k] ? chosen[k].label : '';
  return `MARTIN ${f.name} (${f.size_mm ? f.size_mm + ' mm' : 'size TBC'}${f.dialSize ? ', ' + f.dialSize + ' mm dial' : ''}) — ${c('dials')} dial, ` + (chosen.bezels ? c('bezels') + ' bezel, ' : '') +
         `${c('cases')} case, ${c('bracelets')} bracelet, ` + (chosen.gmthands ? c('gmthands') + ' GMT hand, ' : '') + `${c('hands')} hands — $${f.price}`;
}
function preloadAll(f) {                                          // warm the cache so every click is instant
  const run = () => f.layers.forEach(cat => f.parts[cat].forEach(it => { const i = new Image(); i.src = it.src; if (it.srcGold) { const j = new Image(); j.src = it.srcGold; } }));
  ('requestIdleCallback' in window) ? requestIdleCallback(run, { timeout: 3000 }) : setTimeout(run, 800);
}

$('btnRandom').onclick = surprise;
$('btnRandomAny').onclick = surpriseAny;
$('btnReset').onclick = reset;
$('btnCopy').onclick = async () => {
  try { await navigator.clipboard.writeText(summaryText()); $('btnCopy').textContent = 'Copied'; }
  catch (e) { prompt('Copy your build:', summaryText()); }
  setTimeout(() => $('btnCopy').textContent = 'Copy build', 1500);
};
init();
</script>
</body>
</html>
