# Preferred address: https://www.martinwatchco.com
# (Room for the long Gallery photo addresses in the redirect list below; must come before the first map.)
map_hash_bucket_size 256;

# Railway terminates HTTPS in front of this server and passes the original scheme in X-Forwarded-Proto.
map $http_x_forwarded_proto $mw_forwarded_http {
    default 0;
    http    1;
}

# Old Gallery photo addresses (which contained folder names) -> the new curated photo addresses.
# The list is generated on deploy by scripts/build-curated-gallery.js.
map $uri $mw_gallery_moved {
    default "";
    include /etc/nginx/gallery-redirects.map;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects (e.g. /design-meeting -> /design-meeting/) so the proxy's internal port never leaks into a URL
    absolute_redirect off;
    port_in_redirect off;

    # ── One canonical address ────────────────────────────────────────────────
    # Railway's default domain and the bare domain send visitors and crawlers to www, keeping the path.
    if ($host ~* "\.up\.railway\.app$") { return 301 https://www.martinwatchco.com$request_uri; }
    if ($host = "martinwatchco.com")    { return 301 https://www.martinwatchco.com$request_uri; }
    # Plain http on the real domain goes to https (only when the proxy reports http; never loops).
    set $mw_https_redirect "";
    if ($host = "www.martinwatchco.com") { set $mw_https_redirect "${mw_forwarded_http}"; }
    if ($mw_https_redirect = "1")          { return 301 https://www.martinwatchco.com$request_uri; }

    # ── Clean addresses ──────────────────────────────────────────────────────
    # Typed ".../index.html" goes to the folder address (e.g. /index.html -> /, /watches/diver/index.html -> /watches/diver/).
    # Uses $request_uri (what the visitor asked for), so the server's own internal index.html lookup never redirects.
    if ($request_uri ~ "^(/(?:[^?]*/)?)index\.html(\?.*)?$") { return 301 $1$2; }

    # Old Gallery photo addresses of published photos move permanently to their new addresses.
    if ($mw_gallery_moved) { return 301 $mw_gallery_moved; }

    # Short watch-family addresses go to the real pages (e.g. /diver/ -> /watches/diver/), keeping any query string.
    location ~ "^/(diver|gmt|chronograph|dress|womens)/?$" { return 301 /watches/$1/$is_args$args; }

    # ── Real 404s ────────────────────────────────────────────────────────────
    # Unknown paths used to return the homepage with status 200. Now they get a proper 404 page.
    error_page 404 /404.html;
    location = /404.html { internal; add_header X-Robots-Tag "noindex" always; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Crawler files with the right content types
    location = /robots.txt  { default_type text/plain; try_files $uri =404; }
    location = /sitemap.xml { types { } default_type application/xml; try_files $uri =404; }

    # Admin and internal pages: never in search results (this is not security; the admin API checks its own login)
    location = /admin.html {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Source files and dotfiles are never served
    location ~ /\.            { return 404; }
    location ~ \.(md|sh|py)$  { return 404; }

    # Unpublished original Gallery photos and their old thumbnails still load at their old addresses,
    # but are kept out of search results (their addresses contain folder names).
    location ~ "^/images/Gallery(-thumbs)?/" {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Robots-Tag "noindex" always;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json application/javascript image/svg+xml;
}
